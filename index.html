<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Me</title>
    <!-- مكتبة التليكرام لربط الموقع بالتطبيق -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* هاي الألوان تتبع ثيم التليكرام مال المستخدم */
            --bg-color: var(--tg-theme-bg-color, #181818);
            --text-color: var(--tg-theme-text-color, #fff);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #fff);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* ⚠️ لتغيير الخلفية بصورة مخصصة، ضيف هذا السطر: */
            /* background-image: url('images/bg.jpg'); background-size: cover; */
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
            background: rgba(44, 44, 46, 0.5); /* شفافية مرتبة */
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        /* ⚠️ عدل مسار صورتك الشخصية هنا */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--button-color);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #2c2c2e;
            border: none;
            border-radius: 15px;
            padding: 15px;
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- عدل مسار الصورة هنا -->
        <img src="images/avatar.jpg" alt="صورة" class="profile-img">
        
        <h2>بكل سرية.. شنو ببالك؟ 🤫</h2>
        <textarea id="msg" placeholder="اكتب سؤالك هنا.."></textarea>
        <button onclick="send()">إرسال السؤال 🚀</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // يفتح التطبيق بكامل الشاشة

        // ⚠️ هنا تحط التوكن والآي دي مالتك
        const BOT_TOKEN = '8928341776:AAFF1TnfW_v2SkN0Y-s2EtqM0GdmVUyPJN4';
        const CHAT_ID = '1045489068';

        function send() {
            let msg = document.getElementById('msg').value;
            if(!msg) return alert("اكتب شي أولاً!");

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    chat_id: CHAT_ID, 
                    text: `📩 سؤال مجهول:\n\n${msg}` 
                })
            }).then(() => {
                tg.close(); // يقفل الموقع تلقائياً بعد الإرسال
            });
        }
    </script>
</body>
</html>
